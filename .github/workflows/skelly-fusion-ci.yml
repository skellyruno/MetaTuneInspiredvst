name: Skelly Fusion Engine validation

on:
  push:
    branches:
      - feature/skelly-fusion-tune-engine
      - feature/lyratune-engine-replacement
      - feature/meta-negative-orb-ultra-3p5
      - feature/complete-negative-retune-overload-animation
      - feature/metatune-lyra-controls-note-transitions
      - feature/skell-live-performance-mode
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dsp-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compile deterministic fusion detector tests
        run: |
          c++ -std=c++17 -O2 -Wall -Wextra -Werror -ISource tests/RealtimeAutotune_fusion_guard.cpp -o fusion_guard_test
          ./fusion_guard_test
      - name: Run uploaded LyraTune engine regression suite
        run: |
          c++ -std=c++20 -O2 -ISource/LyraDSP tests/LyraDSP/dsp_tests.cpp \
            Source/LyraDSP/Pitch/TargetSelector.cpp \
            Source/LyraDSP/Pitch/YinDetector.cpp \
            Source/LyraDSP/Pitch/PitchShifter.cpp \
            Source/LyraDSP/Pitch/CorrectionEngine.cpp \
            Source/LyraDSP/TunerChain.cpp \
            Source/LyraDSP/Doubler.cpp \
            Source/LyraDSP/FormantAccent.cpp \
            -o lyra_original_tests
          ./lyra_original_tests
      - name: Test MetaTune automation adapter against real Lyra audio
        run: |
          c++ -std=c++17 -O2 -Wall -Wextra -ISource tests/LyraDSP/metatune_adapter_smoke.cpp \
            Source/LyraDSP/Pitch/TargetSelector.cpp \
            Source/LyraDSP/Pitch/YinDetector.cpp \
            Source/LyraDSP/Pitch/PitchShifter.cpp \
            Source/LyraDSP/Pitch/CorrectionEngine.cpp \
            Source/LyraDSP/TunerChain.cpp \
            Source/LyraDSP/Doubler.cpp \
            Source/LyraDSP/FormantAccent.cpp \
            -o metatune_adapter_smoke
          ./metatune_adapter_smoke

  windows-vst3:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned JUCE
        shell: pwsh
        run: git clone --depth 1 --branch 8.0.9 https://github.com/juce-framework/JUCE.git JUCE
      - name: Configure with tests
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DJUCE_PATH="$env:GITHUB_WORKSPACE/JUCE" -DSKELLTUNE_BUILD_TESTS=ON -DSKELLTUNE_BUILD_WINDOWS_HOST_SMOKE=ON
      - name: Build VST3 and regression tests
        shell: pwsh
        run: cmake --build build --config Release --target MetaTuneInspired_VST3 RealtimeAutotune_fusion_guard LyraOriginalDSPTests MetaTuneLyraAdapterSmoke SkellyVST3Smoke --parallel 4
      - name: Run DSP regression tests
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Load VST3 in a real JUCE host and render UI
        shell: pwsh
        run: |
          $bundle = Get-ChildItem -Path build -Directory -Recurse -Filter '*.vst3' | Select-Object -First 1
          $smoke = Get-ChildItem -Path build -File -Recurse -Filter 'SkellyVST3Smoke.exe' | Select-Object -First 1
          if (-not $bundle -or -not $smoke) { throw 'Missing compiled VST3 or host smoke executable' }
          & $smoke.FullName $bundle.FullName
          if ($LASTEXITCODE -ne 0) { throw "Native host/visual smoke failed with exit code $LASTEXITCODE" }
      - name: Upload UI snapshots for visual QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MetaTune-Negative-Retune-UI-Snapshots
          path: ui_shots/*.png
          if-no-files-found: error
          retention-days: 14
      - name: Package the validated VST3 bundle
        shell: pwsh
        run: |
          $bundle = Get-ChildItem -Path build -Directory -Recurse -Filter '*.vst3' | Select-Object -First 1
          if (-not $bundle) { throw 'MetaTune VST3 bundle is missing' }
          Compress-Archive -Path $bundle.FullName -DestinationPath MetaTune_LyraTune_VST3.zip -Force
          if (-not (Test-Path MetaTune_LyraTune_VST3.zip)) { throw 'VST3 package creation failed' }
      - name: Publish test VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: MetaTune-LyraTune-VST3-Windows-x64
          path: MetaTune_LyraTune_VST3.zip
          if-no-files-found: error
          retention-days: 14
