name: Skelly Fusion Engine validation

on:
  push:
    branches:
      - feature/skelly-fusion-tune-engine
      - feature/lyratune-engine-replacement
      - feature/meta-negative-orb-ultra-3p5
      - feature/complete-negative-retune-overload-animation
      - feature/metatune-lyra-controls-note-transitions
      - feature/skell-live-performance-mode
      - experiment/lowvoice-hybrid-3p4ms
      - experiment/lowvoice-2p5ms
      - experiment/metatune-3way-ab-vst3-20261115
  pull_request:
    branches:
      - main
      - experiment/lowvoice-2p5ms
  workflow_dispatch:

permissions:
  contents: read

# Drop only superseded PR validations. Never cancel main/release/manual jobs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Supersede experimental PR/push validation only. Never cancel main,
  # release, production or manual workflow jobs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/experiment/')) }}

jobs:
  dsp-guard:
    # Match the Linux runtime used to analyse user-provided private vocals;
    # no recording is uploaded as part of this CI workflow.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Compile deterministic fusion detector tests
        run: |
          c++ -std=c++17 -O2 -Wall -Wextra -Werror -ISource tests/RealtimeAutotune_fusion_guard.cpp -o fusion_guard_test
          ./fusion_guard_test
          c++ -std=c++17 -O2 -Wall -Wextra -Werror -ISource tests/RealtimeAutotune_lowvoice_reentry_fade.cpp -o lowvoice_reentry_test
          ./lowvoice_reentry_test
      - name: Run uploaded LyraTune engine regression suite
        run: |
          c++ -std=c++20 -O2 -DSKELLTUNE_LOW_VOICE_LAB=1 -DSKELLTUNE_LAB_FAST_2P5=1 -DSKELLTUNE_3WAY_AB_LAB=1 -ISource/LyraDSP tests/LyraDSP/dsp_tests.cpp \
            Source/LyraDSP/Pitch/TargetSelector.cpp \
            Source/LyraDSP/Pitch/YinDetector.cpp \
            Source/LyraDSP/Pitch/PitchShifter.cpp \
            Source/LyraDSP/Pitch/CorrectionEngine.cpp \
            Source/LyraDSP/TunerChain.cpp \
            Source/LyraDSP/Doubler.cpp \
            Source/LyraDSP/FormantAccent.cpp \
            -o lyra_original_tests
          ./lyra_original_tests
      - name: Test MetaTune automation adapter against real Lyra audio
        run: |
          c++ -std=c++17 -O2 -Wall -Wextra -DSKELLTUNE_LOW_VOICE_LAB=1 -DSKELLTUNE_LAB_FAST_2P5=1 -DSKELLTUNE_3WAY_AB_LAB=1 -ISource tests/LyraDSP/metatune_adapter_smoke.cpp \
            Source/LyraDSP/Pitch/TargetSelector.cpp \
            Source/LyraDSP/Pitch/YinDetector.cpp \
            Source/LyraDSP/Pitch/PitchShifter.cpp \
            Source/LyraDSP/Pitch/CorrectionEngine.cpp \
            Source/LyraDSP/TunerChain.cpp \
            Source/LyraDSP/Doubler.cpp \
            Source/LyraDSP/FormantAccent.cpp \
            -o metatune_adapter_smoke
          ./metatune_adapter_smoke
      - name: Build portable low-voice vocal A/B renderer (private WAVs not included)
        run: |
          c++ -std=c++17 -O2 -Wall -Wextra -DSKELLTUNE_LOW_VOICE_LAB=1 -DSKELLTUNE_LAB_FAST_2P5=1 -DSKELLTUNE_3WAY_AB_LAB=1 -ISource/LyraDSP tools/lowvoice_offline_render.cpp \
            Source/LyraDSP/Pitch/TargetSelector.cpp \
            Source/LyraDSP/Pitch/YinDetector.cpp \
            Source/LyraDSP/Pitch/PitchShifter.cpp \
            Source/LyraDSP/Pitch/CorrectionEngine.cpp \
            Source/LyraDSP/TunerChain.cpp \
            Source/LyraDSP/Doubler.cpp \
            Source/LyraDSP/FormantAccent.cpp \
            -o lowvoice_offline_render
          ./lowvoice_offline_render || test "$?" -eq 2
      - name: Upload private-vocal local testing utility (no audio)
        uses: actions/upload-artifact@v4
        with:
          name: MetaTune-3Way-AB-Offline-Runner-Linux
          path: lowvoice_offline_render
          if-no-files-found: error
          retention-days: 14

  windows-vst3:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned JUCE
        shell: pwsh
        run: git clone --depth 1 --branch 8.0.9 https://github.com/juce-framework/JUCE.git JUCE
      - name: Configure with tests
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DJUCE_PATH="$env:GITHUB_WORKSPACE/JUCE" -DSKELLTUNE_BUILD_TESTS=ON -DSKELLTUNE_BUILD_WINDOWS_HOST_SMOKE=ON -DSKELLTUNE_LOW_VOICE_LAB=ON -DSKELLTUNE_LAB_FAST_2P5=ON -DSKELLTUNE_3WAY_AB_LAB=ON
      - name: Build VST3 and regression tests
        shell: pwsh
        run: cmake --build build --config Release --target MetaTuneInspired_VST3 RealtimeAutotune_fusion_guard RealtimeAutotune_lowvoice_reentry_fade LyraOriginalDSPTests MetaTuneLyraAdapterSmoke SkellyVST3Smoke --parallel 4
      - name: Run DSP regression tests
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Load VST3 in a real JUCE host and render UI
        shell: pwsh
        run: |
          $bundle = Get-ChildItem -Path build -Directory -Recurse -Filter '*.vst3' | Select-Object -First 1
          $smoke = Get-ChildItem -Path build -File -Recurse -Filter 'SkellyVST3Smoke.exe' | Select-Object -First 1
          if (-not $bundle -or -not $smoke) { throw 'Missing compiled VST3 or host smoke executable' }
          & $smoke.FullName $bundle.FullName
          if ($LASTEXITCODE -ne 0) { throw "Native host/visual smoke failed with exit code $LASTEXITCODE" }
      - name: Upload UI snapshots for visual QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MetaTune-3Way-AB-UI-Snapshots
          path: ui_shots/*.png
          if-no-files-found: error
          retention-days: 14
      - name: Package the validated VST3 bundle
        shell: pwsh
        run: |
          $bundle = Get-ChildItem -Path build -Directory -Recurse -Filter '*.vst3' | Select-Object -First 1
          if (-not $bundle) { throw 'MetaTune VST3 bundle is missing' }
          if (-not ($bundle.Name -match 'MetaTune A-B LAB')) { throw 'Research build must have its own plugin identity' }
          $output = 'MetaTune_3Way_AB_LAB_VST3.zip'
          Compress-Archive -Path $bundle.FullName -DestinationPath $output -Force
          if (-not (Test-Path $output)) { throw 'VST3 2.5ms LAB package creation failed' }
      - name: Publish test VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: MetaTune-3Way-AB-LAB-Windows-x64
          path: MetaTune_3Way_AB_LAB_VST3.zip
          if-no-files-found: error
          retention-days: 14
