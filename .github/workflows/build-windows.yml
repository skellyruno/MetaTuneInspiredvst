name: Windows VST3 build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Checkout JUCE
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 8.0.8
          path: JUCE

      - name: Configure
        run: cmake -S . -B build -DJUCE_PATH="${{ github.workspace }}/JUCE" -A x64

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: MetaTuneInspired-Windows-VST3
          path: build/MetaTuneInspired_artefacts/Release/VST3/
          if-no-files-found: error
